server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_min_length 1024;
  # Jars and .mca files are already compressed; re-gzipping them only burns CPU.
  gzip_types application/javascript application/json text/css text/html;

  client_max_body_size 1m;

  location / {
    try_files $uri $uri/ /index.html;
    # index.html names hash-versioned bundles, so a cached copy can pin the browser to a
    # build whose assets no longer exist. The bundles themselves stay immutable-cacheable.
    add_header Cache-Control "no-cache";
  }

  # Read-only view of a world + mod set so ?auto=1 works without drag-and-drop.
  # /srv/jars is populated with symlinks by the entrypoint, which is what lets the
  # vanilla client jar and the mod jars share one URL prefix despite separate mounts.
  location = /dev/manifest.json {
    alias /srv/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # Which live pipeline to use (bridge | spacetime), written by the entrypoint from env.
  # Same shape and same no-store policy as the manifest above.
  location = /dev/source.json {
    alias /srv/source.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # Vanilla sound files, from the read-only .cache mount. Produced by
  # `npm run fetch-sounds`; never baked into the image (Mojang assets are not redistributed).
  location /sounds/ {
    alias /data/client/sounds/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /dev/jar/ {
    alias /srv/jars/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Baked assets: the whole point of the bake is that the browser fetches THIS instead of
  # 129 jars. Served from the read-only .cache mount, produced by `npm run bake-assets`.
  # assets.json is ~950 KB and gzips to ~70 KB, which the gzip_types above already covers.
  # NOT /assets/ — Vite emits the app's own JS and CSS into /assets/, and a location
  # block there shadows the bundle and the page never boots.
  location /baked/ {
    alias /data/client/baked/;
    # The bake already writes a level-9 assets.json.gz; serving that beats re-compressing
    # a megabyte of JSON at nginx's default level on every request.
    gzip_static on;
    add_header Cache-Control "public, max-age=60";
  }

  # Translated shaderpack bundles, served from the read-only .cache mount rather than
  # baked into the image. A bundle is a derived work of the pack, and packs like Sildur's
  # forbid redistribution — keeping it on the host mount means the image ships none of it.
  # The regex restricts this to *.bundle.json so the pack sources next to it stay private —
  # plus `index.json`, the list of built bundles the in-page shaderpack selector reads. That
  # one file has to be here or the selector shows "none built" while a pack sits beside it
  # being served perfectly well; the zips and build scratch next to them stay unreachable.
  location ~ ^/shaderpacks/(?<bundle>index\.json|[A-Za-z0-9._-]+\.bundle\.json)$ {
    alias /data/client/shaderpacks/$bundle;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # The live bridge's WebSocket, proxied under this same origin so `?live` needs no
  # second hostname, no second DNS record and no cross-origin socket.
  #
  # The upstream is named through a VARIABLE with an explicit resolver, which defers DNS
  # to request time. With a literal name nginx resolves it once at startup and refuses to
  # start at all when the bridge container is down — turning "live mode is unavailable"
  # into "the whole viewer is 502".
  location /live {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bridge_host mcwv-bridge;
    proxy_pass http://$bridge_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # An idle observer socket is still a live one; the default 60 s would drop it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The world's own metadata: the free camera opens on Data.SpawnX/Y/Z from here. Only
  # this one file is exposed, not the world directory. Re-read on every load — the spawn
  # can move — and it is a few hundred bytes.
  location = /dev/level.dat {
    alias /data/world/level.dat;
    default_type application/octet-stream;
    add_header Cache-Control "no-store";
  }

  # What a computer shows on its monitor, written by the computer itself into its own save
  # folder. ONLY screen.json is exposed — the folder also holds the computer's programs.
  location ~ ^/dev/computercraft/computer/(?<cid>\d+)/screen\.json$ {
    alias /data/world/computercraft/computer/$cid/screen.json;
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # THE PER-CHUNK API. An Anvil region file is already an indexed per-chunk store: bytes
  # 0-8191 are a table of (sector offset, sector count, timestamp) for each of its 1024
  # chunks, and every chunk sits in its own 4 KB-aligned sectors after that. The page
  # streams the world through Range requests against these files — `bytes=0-8191` for
  # the index, then one Range per chunk or per run of adjacent chunks (chunk-stream.ts) —
  # so no server code cuts chunks apart and no second format exists to drift.
  #
  # Region files are rewritten every few seconds while live mode is on, and the live
  # sync reads that same 8 KB header to find out what changed. Any caching here reports
  # "nothing changed" forever, so there is none; the ETag (mtime + size, nginx's default,
  # made explicit) is still sent so a client can tell one rewrite from the next, and the
  # per-chunk "etag" the page actually keys on is the index entry itself.
  location /dev/region/ {
    alias /data/world/region/;
    etag on;
    add_header Accept-Ranges bytes;
    add_header Cache-Control "no-store";
  }
  # Entity regions are re-read live the same way block regions are — an 8 KB Range read of
  # the header on every flush to find the chunks whose mobs/items moved. Any caching here
  # reports "nothing changed" forever, so there is none.
  location /dev/entities/ {
    alias /data/world/entities/;
    add_header Cache-Control "no-store";
  }
}
