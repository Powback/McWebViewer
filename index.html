<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Without this the page lays out at 980 CSS px and the canvas is drawn at a third of
         the device's real resolution, which on a phone reads as "it just doesn't work". -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>McWebViewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: ui-monospace, Menlo, monospace; overscroll-behavior: none; }
      /* touch-action:none stops the browser claiming drags for scroll/zoom before the
         canvas ever sees them — without it a one-finger look drag pans the page instead. */
      #view { width: 100vw; height: 100dvh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
      #hud, #log {
        position: fixed; left: 8px; color: #fff; font-size: 12px; line-height: 1.5;
        background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; pointer-events: none;
        white-space: pre-wrap; max-width: 90vw;
      }
      #hud { top: 8px; }
      #log { bottom: 8px; color: #9fe; }

      /* Join / Leave, top right. Hidden entirely outside live mode — a button that
         cannot do anything is worse than no button, which is the whole lesson of this
         feature. */
      #topright {
        position: fixed; top: 8px; right: 8px; z-index: 2;
        display: flex; gap: 6px; align-items: flex-start;
        margin-top: env(safe-area-inset-top);
      }
      #join {
        font: 600 13px/1 ui-monospace, Menlo, monospace;
        padding: 10px 16px; border: 0; border-radius: 8px;
        background: #2d5cff; color: #fff; cursor: pointer;
        /* Big enough to hit with a thumb, and clear of the notch on a phone. */
        min-height: 40px;
      }
      #join[hidden] { display: none; }
      #join:disabled { background: #33333d; color: #8a8a94; cursor: not-allowed; }
      #join.leave { background: #b3402f; }
      /* The reason a disabled button is disabled, said out loud rather than in a tooltip
         nobody can open on a phone. */
      #join-why {
        position: fixed; top: 56px; right: 8px; z-index: 2; max-width: min(360px, 60vw);
        color: #ffd27f; font-size: 11px; line-height: 1.45; text-align: right;
        background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 4px;
        pointer-events: none; margin-top: env(safe-area-inset-top);
      }
      #join-why[hidden] { display: none; }

      /* ---- playing HUD -------------------------------------------------------
         DOM rather than canvas: it is all text, boxes and 32px icons, and keeping it
         out of the render loop leaves the frame budget on the world. */
      .mcwv-hotbar {
        position: fixed; left: 50%; transform: translateX(-50%); z-index: 3;
        bottom: calc(10px + env(safe-area-inset-bottom));
        display: flex; gap: 3px; padding: 3px;
        background: rgba(0,0,0,.55); border-radius: 6px;
      }
      .mcwv-slot {
        position: relative; width: 44px; height: 44px; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.08); border: 2px solid transparent; border-radius: 4px;
        cursor: pointer; overflow: hidden;
      }
      .mcwv-slot.selected { border-color: #fff; background: rgba(255,255,255,.18); }
      .mcwv-icon { width: 32px; height: 32px; image-rendering: pixelated; }
      .mcwv-noicon {
        font: 8px/1.1 ui-monospace, Menlo, monospace; color: #cfd; text-align: center;
        padding: 2px; word-break: break-word;
      }
      .mcwv-count {
        position: absolute; right: 2px; bottom: 0; z-index: 1;
        font: 700 11px/1 ui-monospace, Menlo, monospace; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
      .mcwv-vitals {
        position: fixed; left: 50%; transform: translateX(-50%); z-index: 3;
        bottom: calc(62px + env(safe-area-inset-bottom));
        display: flex; gap: 12px; align-items: center;
        background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 6px;
        font: 11px/1.3 ui-monospace, Menlo, monospace; color: #fff; white-space: nowrap;
      }
      .mcwv-stat { display: flex; gap: 5px; align-items: center; }
      .mcwv-stat-label { color: #9aa; }
      .mcwv-bar { display: inline-block; width: 70px; height: 7px; background: #2a2a33; border-radius: 3px; overflow: hidden; }
      .mcwv-bar-fill { display: block; height: 100%; }
      .mcwv-stat-num { min-width: 2ch; text-align: right; }

      .mcwv-chat {
        position: fixed; left: 8px; z-index: 3;
        bottom: calc(110px + env(safe-area-inset-bottom));
        width: min(420px, 60vw); display: flex; flex-direction: column; gap: 4px;
      }
      .mcwv-chat-log {
        max-height: 26vh; overflow-y: auto; display: flex; flex-direction: column;
        font: 12px/1.45 ui-monospace, Menlo, monospace; color: #eee;
      }
      .mcwv-chat-line { background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 3px; }
      .mcwv-chat-system { color: #ffd27f; }
      .mcwv-chat-say { color: #b9e8ff; }
      .mcwv-chat-input {
        display: none; font: 12px ui-monospace, Menlo, monospace;
        padding: 7px 8px; border: 0; border-radius: 4px;
        background: rgba(0,0,0,.8); color: #fff; outline: 1px solid #2d5cff;
      }
      .mcwv-chat-input.open { display: block; }

      .mcwv-panel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 4;
        background: rgba(12,12,18,.95); border: 1px solid #33333d; border-radius: 10px;
        padding: 14px; max-width: min(560px, 92vw); max-height: 80vh; overflow: auto;
        color: #eee; font: 12px ui-monospace, Menlo, monospace;
      }
      .mcwv-panel[hidden] { display: none; }
      .mcwv-panel-title { font-weight: 700; margin-bottom: 10px; }
      .mcwv-panel-note { margin-top: 10px; color: #8a8a94; font-size: 11px; line-height: 1.5; }
      .mcwv-grid { display: grid; grid-template-columns: repeat(9, 44px); gap: 3px; }

      .mcwv-death {
        position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); z-index: 5;
        background: rgba(120,20,20,.92); color: #fff; padding: 16px 24px; border-radius: 10px;
        font: 700 15px ui-monospace, Menlo, monospace;
      }
      .mcwv-death[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">initialising</div>
    <div id="topright">
      <button id="join" hidden>Join</button>
    </div>
    <div id="join-why" hidden></div>
    <div id="log"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
